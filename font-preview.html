<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本机中文字体对比</title>
  <style>
    :root {
      --bg: #f2f1ed;
      --ink: #151515;
      --muted: #6e6d68;
      --line: #d4d2ca;
      --accent: #ff5a1f;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { color-scheme: light; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header {
      min-height: 46vh;
      padding: clamp(2rem, 5vw, 5rem);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .topline {
      display: flex;
      justify-content: space-between;
      gap: 2rem;
      font-size: .76rem;
      color: var(--muted);
    }

    h1 {
      max-width: 11ch;
      margin: 4rem 0 1rem;
      font-size: clamp(3.2rem, 8vw, 8rem);
      font-weight: 560;
      line-height: 1.02;
      letter-spacing: -.075em;
    }

    h1 i { color: var(--accent); font-style: normal; }

    .intro {
      max-width: 42rem;
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.4vw, 1.2rem);
      line-height: 1.7;
    }

    .recommendation {
      padding: 1.1rem clamp(2rem, 5vw, 5rem);
      background: var(--ink);
      color: #f5f4ef;
      font-size: .86rem;
    }

    .recommendation strong { color: #ff794b; }

    main { padding: 0 clamp(1rem, 3vw, 3rem) 5rem; }

    .group { padding-top: clamp(4rem, 7vw, 7rem); }

    .group__heading {
      margin-bottom: 2rem;
      display: grid;
      grid-template-columns: minmax(12rem, .45fr) 1fr;
      gap: 2rem;
      align-items: end;
    }

    .group__heading h2 {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 3rem);
      letter-spacing: -.05em;
    }

    .group__heading p {
      max-width: 42rem;
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .font-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
    }

    .font-card {
      min-height: 22rem;
      padding: clamp(1.4rem, 2.7vw, 2.7rem);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.2);
    }

    .font-card.is-current { background: #e6f0c7; }
    .font-card.is-recommended { box-shadow: inset 0 4px 0 var(--accent); }

    .font-meta {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      color: var(--muted);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: .7rem;
    }

    .font-meta strong { color: var(--ink); font-weight: 620; }

    .font-tags { display: flex; gap: .4rem; flex-wrap: wrap; justify-content: flex-end; }

    .font-tag {
      padding: .2rem .45rem;
      border: 1px solid currentColor;
      white-space: nowrap;
    }

    .sample-title {
      margin: auto 0 1.6rem;
      font-size: clamp(2.15rem, 3.8vw, 4rem);
      font-weight: var(--sample-weight, 500);
      line-height: 1.16;
      letter-spacing: -.055em;
    }

    .sample-body {
      margin: 0;
      color: #4f4e4a;
      font-size: 1rem;
      font-weight: var(--sample-weight, 400);
      line-height: 1.7;
    }

    .font-file {
      margin: 1.2rem 0 0;
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: .64rem;
      word-break: break-all;
    }

    footer {
      padding: 2rem clamp(2rem, 5vw, 5rem);
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.7;
    }

    @media (max-width: 760px) {
      .group__heading { grid-template-columns: 1fr; }
      .font-grid { grid-template-columns: 1fr; }
      .font-card { min-height: 19rem; }
      .sample-title { font-size: clamp(2.3rem, 10vw, 3.6rem); }
    }
  </style>
</head>
<body>
  <header>
    <div class="topline">
      <span>本机字体实测</span>
      <span>32 个字体面孔 / 26 个家族</span>
    </div>
    <div>
      <h1>中文字体<i>。</i></h1>
      <p class="intro">所有字体使用完全相同的标题、正文、字号与版面。重点观察字面宽度、笔画粗细、转角和整体气质，不要只看某一个字。</p>
    </div>
  </header>

  <div class="recommendation">
    当前网站使用 <strong>Noto Sans SC</strong>。它与 MiSans、等线、微软雅黑同属现代无衬线方向，最接近原参考图的干净英文排版。
  </div>

  <main id="font-groups"></main>

  <footer>
    Windows 自带字体可以在本机预览，但不代表可以复制到网站并公开分发。最终选定后还需要核对字体授权。Noto Sans SC 是开源字体，继续使用最省心。
  </footer>

  <script>
    const groups = [
      {
        title: "现代无衬线",
        description: "最适合当前作品集方向。笔画均匀、没有装饰性衬线，现代、清楚，也最接近参考图中的英文气质。",
        fonts: [
          { family: "Noto Sans SC", cn: "Noto Sans SC", style: "当前 450 / 可调 100-900", type: "无衬线", file: "NotoSansSC-VF.ttf", current: true, recommended: true, weight: 450 },
          { family: "MiSans", cn: "MiSans", style: "常规", type: "无衬线", file: "MiSans-Regular.otf", recommended: true, weight: 400 },
          { family: "DengXian", cn: "等线", style: "常规", type: "无衬线", file: "Deng.ttf", recommended: true, weight: 400 },
          { family: "DengXian", cn: "等线", style: "粗体", type: "无衬线", file: "Dengb.ttf", weight: 700 },
          { family: "DengXian Light", cn: "等线 Light", style: "细体", type: "无衬线", file: "Dengl.ttf", weight: 300 },
          { family: "Microsoft YaHei", cn: "微软雅黑", style: "常规", type: "无衬线", file: "msyh.ttc", weight: 400 },
          { family: "Microsoft YaHei", cn: "微软雅黑", style: "粗体", type: "无衬线", file: "msyhbd.ttc", weight: 700 },
          { family: "Microsoft YaHei Light", cn: "微软雅黑 Light", style: "细体", type: "无衬线", file: "msyhl.ttc", weight: 300 },
          { family: "STXihei", cn: "华文细黑", style: "常规", type: "无衬线", file: "STXIHEI.TTF", weight: 400 },
          { family: "SimHei", cn: "黑体", style: "常规", type: "无衬线", file: "simhei.ttf", weight: 400 },
          { family: "Arial Unicode MS", cn: "Arial Unicode MS", style: "常规", type: "全字库无衬线", file: "ARIALUNI.TTF", weight: 400 },
          { family: "Microsoft JhengHei", cn: "微软正黑体", style: "常规", type: "繁体无衬线", file: "msjh.ttc", weight: 400 },
          { family: "Microsoft JhengHei", cn: "微软正黑体", style: "粗体", type: "繁体无衬线", file: "msjhbd.ttc", weight: 700 },
          { family: "Microsoft JhengHei Light", cn: "微软正黑体 Light", style: "细体", type: "繁体无衬线", file: "msjhl.ttc", weight: 300 }
        ]
      },
      {
        title: "宋体与仿宋",
        description: "带有明显粗细变化和笔画末端装饰，书卷感、编辑感更强。如果放到当前 Hero，会从现代作品集转向出版物或文化项目。",
        fonts: [
          { family: "Noto Serif SC", cn: "Noto Serif SC", style: "可变字重", type: "衬线 / 宋体", file: "NotoSerifSC-VF.ttf", weight: 520 },
          { family: "SimSun", cn: "宋体", style: "常规", type: "宋体", file: "simsun.ttc", weight: 400 },
          { family: "STSong", cn: "华文宋体", style: "常规", type: "宋体", file: "STSONG.TTF", weight: 400 },
          { family: "STZhongsong", cn: "华文中宋", style: "常规", type: "宋体", file: "STZHONGS.TTF", weight: 400 },
          { family: "FangSong", cn: "仿宋", style: "常规", type: "仿宋", file: "simfang.ttf", weight: 400 },
          { family: "STFangsong", cn: "华文仿宋", style: "常规", type: "仿宋", file: "STFANGSO.TTF", weight: 400 }
        ]
      },
      {
        title: "书写与装饰字体",
        description: "个性最强，但大面积正文可读性较弱。更适合海报短句、文化标题或局部点缀，不建议替换当前网站的全部文字。",
        fonts: [
          { family: "KaiTi", cn: "楷体", style: "常规", type: "楷体", file: "simkai.ttf", weight: 400 },
          { family: "STKaiti", cn: "华文楷体", style: "常规", type: "楷体", file: "STKAITI.TTF", weight: 400 },
          { family: "STXingkai", cn: "华文行楷", style: "常规", type: "行楷", file: "STXINGKA.TTF", weight: 400 },
          { family: "STXinwei", cn: "华文新魏", style: "常规", type: "魏碑", file: "STXINWEI.TTF", weight: 400 },
          { family: "LiSu", cn: "隶书", style: "常规", type: "隶书", file: "SIMLI.TTF", weight: 400 },
          { family: "STLiti", cn: "华文隶书", style: "常规", type: "隶书", file: "STLITI.TTF", weight: 400 },
          { family: "YouYuan", cn: "幼圆", style: "常规", type: "圆体", file: "SIMYOU.TTF", weight: 400 },
          { family: "FZShuTi", cn: "方正舒体", style: "常规", type: "书写体", file: "FZSTK.TTF", weight: 400 },
          { family: "FZYaoTi", cn: "方正姚体", style: "常规", type: "装饰体", file: "FZYTK.TTF", weight: 400 },
          { family: "STCaiyun", cn: "华文彩云", style: "常规", type: "装饰体", file: "STCAIYUN.TTF", weight: 400 },
          { family: "STHupo", cn: "华文琥珀", style: "常规", type: "装饰体", file: "STHUPO.TTF", weight: 400 },
          { family: "yyb", cn: "yyb", style: "常规", type: "用户安装字体", file: "yyb.ttf", weight: 400 }
        ]
      }
    ];

    const root = document.getElementById("font-groups");

    groups.forEach((group) => {
      const section = document.createElement("section");
      section.className = "group";

      const heading = document.createElement("div");
      heading.className = "group__heading";
      heading.innerHTML = `<h2>${group.title}</h2><p>${group.description}</p>`;

      const grid = document.createElement("div");
      grid.className = "font-grid";

      group.fonts.forEach((font) => {
        const card = document.createElement("article");
        card.className = `font-card${font.current ? " is-current" : ""}${font.recommended ? " is-recommended" : ""}`;
        card.style.fontFamily = `"${font.family}", sans-serif`;
        card.style.setProperty("--sample-weight", font.weight);
        card.innerHTML = `
          <div class="font-meta">
            <div><strong>${font.cn}</strong><br>${font.family}</div>
            <div class="font-tags">
              ${font.current ? '<span class="font-tag">当前使用</span>' : ""}
              ${font.recommended ? '<span class="font-tag">适合本站</span>' : ""}
              <span class="font-tag">${font.type}</span>
              <span class="font-tag">${font.style}</span>
            </div>
          </div>
          <p class="sample-title">一个清晰、有重点的个人网站。</p>
          <p class="sample-body">呈现我的项目、实验与想法，保持清晰，也保留思考。AI × 2026</p>
          <p class="font-file">${font.file}</p>
        `;
        grid.appendChild(card);
      });

      section.append(heading, grid);
      root.appendChild(section);
    });
  </script>
</body>
</html>
